<nav class="border-b border-gray-300">
  <div
    class="flex flex-wrap items-center justify-between max-w-screen-xl mx-auto p-4"
  >
    <a
      aria-label="Company Logo"
      routerLink="/"
      class="flex items-center space-x-3 rtl:space-x-reverse"
    >
      <img
        src="https://flowbite.com/docs/images/logo.svg"
        class="h-8"
        alt="Company Logo"
      />
      <span
        class="self-center text-2xl font-semibold whitespace-nowrap text-gray-950"
        >Company</span
      >
    </a>
    <div
      class="flex items-center md:order-2 space-x-1 md:space-x-2 rtl:space-x-reverse"
    >
      <a
        aria-label="Go to Login"
        routerLink="/login"
        class="text-gray-700 border border-gray-500 focus:ring-4 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 hover:bg-gray-100 focus:outline-none focus:ring-gray-200"
        >Login</a
      >
      <a
        aria-label="Go to Sign Up"
        routerLink="/signup"
        class="text-white focus:ring-4 font-medium rounded-lg text-sm px-4 py-2 md:px-5 md:py-2.5 bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-blue-300"
        >Sign up</a
      >
      <button
        data-collapse-toggle="mega-menu-icons"
        type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm rounded-lg md:hidden focus:outline-none focus:ring-2 text-gray-500 hover:bg-gray-100 focus:ring-gray-200"
        aria-controls="mega-menu-icons"
        aria-expanded="false"
      >
        <span class="sr-only">Open main menu</span>
        <svg
          class="w-5 h-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 17 14"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15"
          />
        </svg>
      </button>
    </div>
    <div
      id="mega-menu-icons"
      class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
    >
      <ul
        class="flex flex-col mt-4 font-medium md:flex-row md:mt-0 md:space-x-8 rtl:space-x-reverse"
      >
        <li>
          <a
            routerLink="/"
            aria-label="Home"
            class="block py-2 px-3 border-b md:border-0 md:p-0 text-gray-950 hover:bg-gray-100 hover:text-blue-600 md:hover:bg-transparent border-gray-300"
            aria-current="page"
            >Home</a
          >
        </li>
        <li>
          <a
            role="button"
            aria-label="Products Categories"
            id="mega-menu-icons-dropdown-button"
            data-dropdown-toggle="mega-menu-icons-dropdown"
            data-dropdown-placement="bottom"
            class="flex items-center justify-between w-full py-2 px-3 font-medium border-b md:w-auto md:hover:bg-transparent md:border-0 md:p-0 text-gray-950 hover:bg-gray-100 hover:text-blue-600 border-gray-300"
          >
            Products
            <svg
              class="w-2.5 h-2.5 ms-3"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 10 6"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m1 1 4 4 4-4"
              />
            </svg>
          </a>
          <div
            id="mega-menu-icons-dropdown"
            class="absolute z-10 w-auto grid grid-cols-2 text-sm border rounded-lg shadow-md border-gray-300 md:grid-cols-3 bg-white"
            [class.hidden]="true"
          >
            <div class="p-4 text-gray-950 col-span-full">
              <ul
                class="grid grid-cols-2 md:grid-cols-3 gap-y-4 gap-x-8"
                aria-labelledby="mega-menu-icons-dropdown-button"
              >
                @for (category of categories(); track category.id) {
                  <li>
                    <a
                      routerLink="/products"
                      [queryParams]="{ category: category.id }"
                      class="flex items-center text-gray-700 hover:text-blue-600 group"
                    >
                      <svg
                        class="w-3 h-3 me-2 text-gray-500 group-hover:text-blue-600 shrink-0"
                        fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 512 512"
                      >
                        <path
                          d="M256 0a256 256 0 1 1 0 512A256 256 0 1 1 256 0zM232 120l0 136c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2 280 120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"
                        />
                      </svg>
                      {{ category.nombre }}
                    </a>
                  </li>
                }
              </ul>
            </div>
          </div>
        </li>
        <li>
          <a
            routerLink="/cart"
            aria-label="Go to Cart"
            class="block py-2 px-3 border-b md:border-0 md:p-0 text-gray-950 hover:bg-gray-100 hover:text-blue-600 md:hover:bg-transparent border-gray-300"
            >Cart</a
          >
        </li>
      </ul>
    </div>
  </div>
</nav>
